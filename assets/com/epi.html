<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Epidarex</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <!-- Non-standard, honoured by some AI crawlers; harmless where it is not. -->
  <meta name="robots" content="noai, noimageai">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f3f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #__bundler_loading {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      color: #666;
      background: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      z-index: 10000;
    }

    #__bundler_thumbnail {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f2f2;
      z-index: 9999;
    }

    #__bundler_thumbnail svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #__bundler_placeholder {
      color: #999;
      font-size: 14px;
    }
  </style>
  <noscript>
    <style>
      #__bundler_loading {
        display: none;
      }
    </style>
    <div
      style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>

  <!-- Custom CSS. Edit freely: this block is detached when the bundler swaps in
       the template document, then re-appended to the live <head> and kept last,
       so it overrides the template's own styles. -->
  <style id="__custom_css">
    .bio-canvas-aperture { 
      /* opacity: 0.7; */
      /* right: -12% !important; */
      width: auto !important;
      aspect-ratio: 1/1;
      /* transform: scale(130%); */
      /* Point grid fades out from the centre: 100% at the middle, 40% at the
         furthest corner. farthest-corner puts the gradient's 100% stop exactly
         on the corners, so "furthest from centre" lands at 0.4 whatever the
         element's aspect ratio. 
      -webkit-mask-image: radial-gradient(ellipse farthest-corner at 50% 50%,
          rgba(0, 0, 0, 1) 0%,
          rgba(0, 0, 0, 0.1) 70%);
      mask-image: radial-gradient(ellipse farthest-corner at 50% 50%,
          rgba(0, 0, 0, 1) 0%,
          rgba(0, 0, 0, 0.1) 70%);*/
    }

    .bio-canvas-helix {
      transform: scale(130%);
    }

    h1 {
      font-size: clamp(50px, 7.5vw, 148px) !important;
    }

    p {
      margin: clamp(30px, 4.9vh, 52px) 0px 0px;
    }

    /* x-dc stamps data-dc-tpl at runtime, so this attribute exists only in the
       live DOM, not in the template source. !important is required: the template
       lays out with inline style="" declarations, which outrank any stylesheet
       rule on specificity alone. */
    [data-dc-tpl="37"] {
      align-items: flex-start !important;
    }
  </style>
</head>

<body>
  
  <div id="__bundler_thumbnail">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#f3f2f2"></rect>
      <g fill="#201f1d">
        <circle cx="600" cy="200" r="26"></circle>
        <circle cx="600" cy="600" r="26"></circle>
        <circle cx="480" cy="260" r="22"></circle>
        <circle cx="720" cy="260" r="22"></circle>
        <circle cx="430" cy="400" r="26"></circle>
        <circle cx="770" cy="400" r="26"></circle>
        <circle cx="480" cy="540" r="22"></circle>
        <circle cx="720" cy="540" r="22"></circle>
      </g>
      <g fill="#ea0909">
        <circle cx="600" cy="330" r="16"></circle>
        <circle cx="600" cy="400" r="18"></circle>
        <circle cx="600" cy="470" r="16"></circle>
      </g>
    </svg>
  </div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>

    document.addEventListener('DOMContentLoaded', async function () {
      const loading = document.getElementById('__bundler_loading');
      function setStatus(msg) { if (loading) loading.textContent = msg; }

      const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
      const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
      function toBase64(bytes) {
        let bin = '';
        for (let i = 0; i < bytes.length; i += 0x8000) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        }
        return btoa(bin);
      }

      // Error sink persists across replaceWith since it's on window, not the DOM.
      window.addEventListener('error', function (e) {
        // Failed resource loads (CSP-blocked links, scripts, images) fire plain
        // events at the element — warn only; real JS errors carry message/error.
        if (!e.message && !e.error && e.target && e.target !== window) {
          console.warn('[bundle] resource failed to load:',
            e.target.tagName, String(e.target.src || e.target.href || ''));
          return;
        }
        var p = document.body || document.documentElement;
        var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
        d.id = '__bundler_err';
        d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
        d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
          '[bundle] ' + (e.message || e.type) +
          (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
      }, true);

      try {
        const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
        const templateEl = document.querySelector('script[type="__bundler/template"]');
        if (!manifestEl || !templateEl) {
          setStatus('Error: missing bundle data');
          console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
          return;
        }

        const manifest = JSON.parse(manifestEl.textContent);
        let template = JSON.parse(templateEl.textContent);

        // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
        // document's manifest; frame srcs carry an about:blank#<uuid> marker
        // instead of a substitutable uuid. Every document mints the blobs for
        // its OWN frames — from local text at the root, or text obtained from
        // its DIRECT parent over the relay protocol below — so each frame
        // navigation stays same-origin with its initiator and a deduped page
        // loads at any depth on any host, including a file:// download's
        // opaque origins (where a blob minted by one document cannot be
        // navigated to by another).
        const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
        const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
        const pageSet = new Set(pageOrder);
        const pageTexts = {};

        // ── Nested-page text protocol (parent-chain relay) ──
        // Page bundles ship once, in the ROOT document's manifest. Every
        // document mints the blobs for its OWN frames, obtaining page text
        // through a strict parent-chain relay: a document only ever SENDS to
        // its direct parent (which, for every document the publisher's own
        // runtime minted, is another publisher document) and only ACCEPTS
        // text from that direct parent; requests from below are honored only
        // for the document's own child frames, and the ROOT never sends
        // upward at all. That last rule is load-bearing: the artifact host's
        // frame-ancestors allows claude.ai (and friends) to frame an
        // artifact, so window.top can be a FOREIGN document — a top-addressed
        // protocol would hand page uuids to that ancestor and accept forged
        // "page text" from it, minting attacker HTML as an artifact-origin
        // blob document. The chain never touches the ancestor: requests stop
        // at the root, replies are origin-addressed per hop (never '*' when
        // an origin exists), and both directions are origin-gated (on https
        // a foreign sender's origin can never equal this document's; in
        // opaque contexts — file:// — everything serializes as 'null', where
        // an embedded EXTERNAL frame still fails the gate by carrying its
        // own real origin, and a sandboxed child of such a frame is excluded
        // by the own-child-frames check plus uuid unguessability). Shape is
        // deny-by-default: one request form, one reply form, no error
        // replies.
        // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
        // contexts such as a sandboxed preview iframe) — location.origin is
        // computed from the URL and stays 'https://…' even when the document
        // is sandboxed, which would misgate every opaque chain.
        const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
          ? window.origin
          : '*';
        function trustedOrigin(e) {
          if (e.origin === window.origin) return true; // https chains; opaque==opaque
          // file:// trees: Chrome serializes the file document's origin as
          // 'file://' while the blob: documents it mints serialize as 'null',
          // so the two legitimate shapes can never string-match — accept the
          // pair in both directions. https origins never serialize as either,
          // and sender identity (own child frame / direct parent) is checked
          // separately.
          return (
            (e.origin === 'null' &&
              (window.origin === 'file://' ||
                window.location.protocol === 'file:')) ||
            (/^file:/.test(e.origin) && window.origin === 'null')
          );
        }
        // Non-empty only in the root document (nested bundles ship an empty
        // island), so it doubles as the root marker: the root answers from
        // local text and treats a miss as authoritative — never relaying to
        // its (possibly foreign) parent.
        const isPageRoot = pageOrder.length > 0;
        const blobUrls = {};
        const resourceBlobs = {};
        const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
        const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
        const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
        function mountPage(el, frag, text) {
          const pageBlob = new Blob([text], { type: 'text/html' });
          const u = URL.createObjectURL(pageBlob);
          resourceBlobs[u] = pageBlob;
          el.src = u + frag;
        }
        function deliverPage(uuid, text) {
          const frames = pendingFrames[uuid];
          delete pendingFrames[uuid];
          if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
          const relays = pendingRelays[uuid];
          delete pendingRelays[uuid];
          if (relays) {
            for (const cw of relays) {
              try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
            }
          }
        }
        function ownFrameWindows() {
          const out = [];
          for (const f of Array.from(document.querySelectorAll('iframe'))) {
            try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
          }
          return out;
        }
        window.addEventListener('message', function (e) {
          const d = e.data;
          if (!d || typeof d !== 'object' || !e.source) return;
          // Origin gate first; the structural checks below (own-child-frames
          // for requests, direct-parent + solicited-uuid for replies, the
          // root's never-relay rule) are what hold in fully opaque chains
          // where origin strings can't discriminate — a sandboxed root's
          // FOREIGN wrapper still fails all three even though both serialize
          // as real-vs-'null' rather than matching.
          if (!trustedOrigin(e)) return;
          if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
            // Requests are honored only for this document's own child frames.
            if (ownFrameWindows().indexOf(e.source) < 0) return;
            const uuid = d.__bundler_need;
            const text = pageTexts[uuid];
            if (typeof text === 'string') {
              try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
              return;
            }
            if (isPageRoot || window.parent === window) return; // authoritative miss
            const waiting = pendingRelays[uuid];
            if (waiting) {
              if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
              return;
            }
            // Never-answered uuids would otherwise accumulate forever under a
            // request spray; past the cap (far above any real page count) new
            // relays are dropped rather than remembered.
            if (Object.keys(pendingRelays).length >= 128) return;
            pendingRelays[uuid] = [e.source];
            window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
          } else if (
            typeof d.__bundler_page === 'string' &&
            UUID_SHAPE.test(d.__bundler_page) &&
            typeof d.__bundler_text === 'string'
          ) {
            // The shape test is load-bearing beyond tidiness: the solicited
            // check below uses the in operator, which matches prototype keys
            // ('__proto__', 'constructor') — an unshaped key would reach
            // deliverPage and throw, painting the error banner.
            // Text is accepted only from the direct parent — the document
            // that minted this one.
            if (e.source !== window.parent || window.parent === window) return;
            if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
            deliverPage(d.__bundler_page, d.__bundler_text);
          }
        });

        const uuids = Object.keys(manifest);
        setStatus('Unpacking ' + uuids.length + ' assets...');

        await Promise.all(uuids.map(async (uuid) => {
          const entry = manifest[uuid];
          try {
            const binaryStr = atob(entry.data);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            let finalBytes = bytes;
            if (entry.compressed) {
              if (typeof DecompressionStream !== 'undefined') {
                const ds = new DecompressionStream('gzip');
                const writer = ds.writable.getWriter();
                const reader = ds.readable.getReader();
                writer.write(bytes);
                writer.close();
                const chunks = [];
                let totalLen = 0;
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  chunks.push(value);
                  totalLen += value.length;
                }
                finalBytes = new Uint8Array(totalLen);
                let offset = 0;
                for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
              } else {
                console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
              }
            }

            if (pageSet.has(uuid)) {
              pageTexts[uuid] = new TextDecoder().decode(finalBytes);
              return;
            }
            if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
              // Strict artifact hosts allow font-src data: but not blob:.
              blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
                (entry.compressed ? toBase64(finalBytes) : entry.data);
            } else {
              const blob = new Blob([finalBytes], { type: entry.mime });
              blobUrls[uuid] = URL.createObjectURL(blob);
              resourceBlobs[blobUrls[uuid]] = blob;
            }
          } catch (err) {
            console.error('Failed to decode asset ' + uuid + ':', err);
            const blob = new Blob([], { type: entry.mime });
            blobUrls[uuid] = URL.createObjectURL(blob);
            resourceBlobs[blobUrls[uuid]] = blob;
          }
        }));

        const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
        const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
        const resourceMap = {};
        for (const entry of extResources) {
          if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
        }

        // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
        // consumers read these Blobs directly. Survives the swap like the error sink.
        window.__resourceBlobs = resourceBlobs;

        setStatus('Rendering...');
        // Page uuids have no blob here — they ride inside about:blank#<uuid>
        // frame markers the pass below resolves after the swap.
        for (const uuid of uuids) {
          if (pageSet.has(uuid)) continue;
          template = template.split(uuid).join(blobUrls[uuid]);
        }

        // Strip integrity + crossorigin — blob URLs from a file:// document inherit
        // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
        // The manifest bytes are ours; SRI protects against CDN compromise, not this.
        template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

        const resourceScript = '<script>window.__resources = ' +
          JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
          ';</' + 'script>';
        // Inject after <head> so the DOCTYPE stays first; prepending the script
        // would push the parser into quirks mode. DOMParser always emits a <head>
        // (synthesizing one if the source HTML omitted it) but may carry
        // attributes through, so match the full opening tag. slice() rather than
        // replace() keeps us clear of $-pattern substitution in resourceScript.
        const headOpen = template.match(/<head[^>]*>/i);
        if (headOpen) {
          const i = headOpen.index + headOpen[0].length;
          template = template.slice(0, i) + resourceScript + template.slice(i);
        }

        // Parse the template and swap the root element. Scripts inserted via
        // DOMParser/replaceWith are inert per spec — re-create each with
        // createElement so they execute, awaiting onload for src scripts to
        // preserve ordering (React before ReactDOM before Babel before text/babel).
        const customStyle = document.getElementById('__custom_css');
        const doc = new DOMParser().parseFromString(template, 'text/html');
        document.documentElement.replaceWith(doc.documentElement);

        // Resolve page-frame markers: mint this document's own blob for each
        // framed page — from local text when this is the root, otherwise by
        // asking the direct parent over the relay protocol above. An
        // unanswered request leaves the frame on about:blank, the same
        // degraded state as a refused embed.
        {
          const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
          const needed = [];
          for (const el of Array.from(document.querySelectorAll('iframe'))) {
            const m = MARKER.exec(el.getAttribute('src') || '');
            if (!m) continue;
            const text = pageTexts[m[1]];
            if (typeof text === 'string') {
              mountPage(el, m[2] || '', text);
            } else if (window.parent !== window && !isPageRoot) {
              const had = pendingFrames[m[1]];
              (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
              if (!had) needed.push(m[1]);
            }
          }
          for (const uuid of needed) {
            window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
          }
        }

        const dead = Array.from(document.scripts);
        for (const old of dead) {
          const s = document.createElement('script');
          for (const a of old.attributes) s.setAttribute(a.name, a.value);
          s.textContent = old.textContent;
          // text/babel scripts with a src: read and inline. transformScriptTags
          // does XHR against the src, but blob:null/ from a file:// origin is
          // silently dropped. Inlining makes it a plain inline babel script,
          // which transformScriptTags handles unconditionally.
          if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
            const pre = resourceBlobs[s.src.split('#')[0]];
            s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
            s.removeAttribute('src');
          }
          const p = s.src ? new Promise(function (r) { s.onload = s.onerror = r; }) : null;
          old.replaceWith(s);
          if (p) await p;
        }
        // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
        // which fired before we swapped the document. Trigger manually if present.
        if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
          window.Babel.transformScriptTags();
        }

        // The outer document — including the author's #__custom_css block — was
        // discarded by the replaceWith above. Re-append it to the live head and
        // keep it the last child, so runtimes that hoist their own <style> tags
        // into head later (x-dc's helmet, styled-components, etc.) can't
        // out-order it. The guard makes the observer's self-trigger a no-op.
        if (customStyle && document.head) {
          const keepLast = function () {
            if (document.head.lastElementChild !== customStyle) {
              document.head.appendChild(customStyle);
            }
          };
          keepLast();
          new MutationObserver(keepLast).observe(document.head, { childList: true });
        }
      } catch (err) {
        setStatus('Error unpacking: ' + err.message);
        console.error('Bundle unpack error:', err);
      }
    });

+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201f1d;\n  --color-accent: #ea0909;\n  --color-accent-2: #fcb043;\n  --color-divider: color-mix(in srgb, #201f1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2f0;\n  --color-accent-200: #ffe0da;\n  --color-accent-300: #ffc3ba;\n  --color-accent-400: #ff9687;\n  --color-accent-500: #ff5646;\n  --color-accent-600: #e21510;\n  --color-accent-700: #b20002;\n  --color-accent-800: #820001;\n  --color-accent-900: #530d08;\n\n  --color-accent-2-100: #fff3e5;\n  --color-accent-2-200: #ffe3c1;\n  --color-accent-2-300: #ffc985;\n  --color-accent-2-400: #efa741;\n  --color-accent-2-500: #cf8700;\n  --color-accent-2-600: #a66c00;\n  --color-accent-2-700: #805200;\n  --color-accent-2-800: #5c3a00;\n  --color-accent-2-900: #3e2500;\n\n  --font-heading: \"Cormorant Garamond\", system-ui, sans-serif;\n  --font-heading-weight: 600; /* review round 3: bold retired — semibold is the\n     interface headings' ceiling (they need the weight at small sizes); display\n     text goes lighter still, to the normal cut (see the deck) */\n  --font-body: \"Lora\", system-ui, sans-serif;\n\n  --space-1: 4.6px;\n  --space-2: 9.2px;\n  --space-3: 13.8px;\n  --space-4: 18.4px;\n  --space-6: 27.6px;\n  --space-8: 36.8px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.plate{filter:sepia(0.22) saturate(0.82) contrast(1.05);box-sizing:border-box;\n  border:6px solid var(--color-surface);outline:1px solid var(--color-divider)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: transparent;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: transparent; border: 1px solid var(--color-divider);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 1px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg); border: 1px solid var(--color-divider);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<style>\n  html { scroll-behavior: smooth; }\n  body { margin: 0; background: #f3f2f2; color: #201f1d; font-family: Lora, Georgia, serif; font-size: 17px; -webkit-font-smoothing: antialiased; }\n  ::selection { background: rgba(234,9,9,.18); }\n  a { color: inherit; text-decoration: none; }\n  a:hover { color: #ea0909; }\n  :focus-visible { outline: 2px solid #ea0909; outline-offset: 4px; }\n  @keyframes lift { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }\n  @keyframes bleed { from { opacity: 0; } to { opacity: 1; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background: #f3f2f2; color: #201f1d; overflow-x: hidden;\">\n\n<header style=\"position: fixed; top: 0; left: 0; right: 0; z-index: 60; background: #f3f2f2; border-bottom: 1px solid rgba(32,31,29,.16);\">\n  <nav style=\"max-width: 1560px; margin: 0 auto; padding: 30px clamp(22px, 4.5vw, 72px); display: flex; align-items: center; justify-content: space-between; gap: 40px;\">\n    <a href=\"#top\"><img src=\"edc2e15c-e2dc-4c2a-b852-bbef877b63bc\" alt=\"Epidarex Capital\" style=\"height: 40px; width: auto; display: block;\"><\u002Fa>\n    <div style=\"display: flex; align-items: baseline; gap: clamp(20px, 3vw, 44px); font-family: Lora, Georgia, serif; font-size: 12.5px; letter-spacing: .05em; color: rgba(32,31,29,.6);\">\n      <a href=\"#thesis\" style=\"transition: color .35s;\" style-hover=\"color: #ea0909;\">Thesis<\u002Fa>\n      <a href=\"#companies\" style=\"transition: color .35s;\" style-hover=\"color: #ea0909;\">Companies<\u002Fa>\n      <a href=\"#people\" style=\"transition: color .35s;\" style-hover=\"color: #ea0909;\">People<\u002Fa>\n      <a href=\"#contact\" style=\"font-style: italic; color: #ea0909;\">Get in touch<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n<\u002Fheader>\n\n<!-- ── hero ─────────────────────────────────────────────────────────────── -->\n<section id=\"top\" style=\"position: relative; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); align-items: center; gap: clamp(24px, 4vw, 64px); padding: 130px clamp(22px, 4.5vw, 72px) 90px; max-width: 1560px; margin: 0 auto;\">\n  <div>\n    <p style=\"font-family: Lora, Georgia, serif; font-style: italic; font-size: 13px; letter-spacing: .04em; color: rgba(32,31,29,.55); margin: 0 0 clamp(28px, 4vh, 48px); animation: lift .9s .05s both cubic-bezier(.2,.7,.2,1);\">Life science venture capital · Edinburgh &amp; Bethesda<\u002Fp>\n    <h1 style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(50px, 8.4vw, 148px); line-height: .9; letter-spacing: -.038em; margin: 0; animation: lift 1.1s .15s both cubic-bezier(.2,.7,.2,1);\">\n      The first<br>believer<br>in the <span style=\"font-style: italic; color: #ea0909;\">data<\u002Fspan>.\n    <\u002Fh1>\n    <p style=\"font-size: clamp(16px, 1.35vw, 20px); line-height: 1.72; color: rgba(32,31,29,.7); max-width: 40ch; margin: clamp(30px, 4.5vh, 52px) 0 0; text-wrap: pretty; animation: lift 1.1s .3s both cubic-bezier(.2,.7,.2,1);\">\n      We co-found and capitalise companies out of university science in the under-ventured regions of the UK and United States — reading the primary data ourselves, and staying for the decade that follows.\n    <\u002Fp>\n    <div style=\"display: flex; gap: clamp(18px, 3vw, 38px); align-items: baseline; margin-top: clamp(30px, 4.5vh, 52px); animation: lift 1.1s .42s both cubic-bezier(.2,.7,.2,1);\">\n      <a href=\"#contact\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px; color: #ea0909; border-bottom: 1px solid rgba(234,9,9,.4); padding-bottom: 6px; transition: border-color .4s;\" style-hover=\"border-color: #ea0909;\">Founders, start here<\u002Fa>\n      <a href=\"#thesis\" style=\"font-size: 12.5px; letter-spacing: .05em; color: rgba(32,31,29,.55); border-bottom: 1px solid rgba(32,31,29,.2); padding-bottom: 6px; transition: color .4s, border-color .4s;\" style-hover=\"color: #201f1d; border-color: rgba(32,31,29,.5);\">How we invest<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <figure style=\"position: relative; height: min(76vh, 780px); margin: 0; animation: bleed 1.8s .25s both;\">\n    <canvas class=\"bio-canvas bio-canvas-helix\" data-bio=\"helix\" data-orient=\"vertical\" data-turns=\"3.1\" data-r=\"4\" data-alpha=\"0.72\" data-accent=\"234,9,9\" style=\"position: absolute; inset: 0; width: 100%; height: 100%;\"><\u002Fcanvas>\n  <\u002Ffigure>\n<\u002Fsection>\n\n<!-- ── key message I ────────────────────────────────────────────────────── -->\n<section style=\"position: relative; background: #201f1d; color: #f3f2f2; overflow: hidden;\">\n  <canvas class=\"bio-canvas bio-canvas-aperture\" data-bio=\"aperture\" data-ink=\"243,242,242\" data-alpha=\"0.62\" data-step=\"15\" data-cx=\"0.5\" data-cy=\"0.5\" data-spread=\"0.5\" style=\"position: absolute; top: 0; bottom: 0; right: 0; width: 46%; height: 100%;\"><\u002Fcanvas>\n  <div style=\"position: relative; max-width: 1560px; margin: 0 auto; padding: clamp(96px, 17vh, 224px) clamp(22px, 4.5vw, 72px);\">\n    <p data-reveal=\"0\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(34px, 5.4vw, 92px); line-height: 1.02; letter-spacing: -.032em; margin: 0; max-width: 26ch; text-wrap: balance;\">\n      Most great science never meets an investor who can read it.\n    <\u002Fp>\n    <p data-reveal=\"1\" style=\"font-size: clamp(14.5px, 1.1vw, 17px); line-height: 1.78; color: rgba(243,242,242,.62); max-width: 46ch; margin: clamp(32px, 4.5vh, 58px) 0 0;\">\n      Our partners hold doctorates in the fields they fund. Diligence begins with the protocol, the primary data and the researcher — not with the deck describing them.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── thesis ───────────────────────────────────────────────────────────── -->\n<section id=\"thesis\" style=\"max-width: 1560px; margin: 0 auto; padding: clamp(96px, 17vh, 224px) clamp(22px, 4.5vw, 72px);\">\n  <p data-reveal=\"0\" style=\"font-family: Lora, Georgia, serif; font-style: italic; font-size: 13px; letter-spacing: .04em; color: rgba(32,31,29,.5); margin: 0 0 clamp(36px, 5.5vh, 76px);\">How we invest<\u002Fp>\n  <sc-for list=\"{{ thesis }}\" as=\"t\" hint-placeholder-count=\"3\">\n    <div data-reveal=\"{{ t.i }}\" style=\"display: grid; grid-template-columns: minmax(0, 74px) minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(18px, 4vw, 76px); align-items: baseline; padding: clamp(40px, 6.5vh, 88px) 0; border-top: 1px solid rgba(32,31,29,.16);\">\n      <span style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(30px, 3vw, 46px); line-height: 1; color: #ea0909; font-feature-settings: 'tnum';\">{{ t.num }}<\u002Fspan>\n      <h2 style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(30px, 3.9vw, 64px); line-height: 1.02; letter-spacing: -.03em; margin: 0; text-wrap: balance;\">{{ t.title }}<\u002Fh2>\n      <p style=\"margin: 0; font-size: clamp(14.5px, 1.05vw, 16.5px); line-height: 1.8; color: rgba(32,31,29,.65); max-width: 44ch;\">{{ t.body }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fsection>\n\n<!-- ── key message II, on the culture plate ─────────────────────────────── -->\n<section style=\"border-top: 1px solid rgba(32,31,29,.16); background: #eae9e9;\">\n  <div style=\"max-width: 1560px; margin: 0 auto; padding: clamp(96px, 17vh, 224px) clamp(22px, 4.5vw, 72px); display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: clamp(38px, 7vw, 110px); align-items: center;\">\n    <figure data-reveal=\"0\" style=\"margin: 0; position: relative; width: 100%; max-width: 540px; aspect-ratio: 1; justify-self: center;\">\n      <div style=\"position: absolute; inset: 0; border-radius: 50%; overflow: hidden; border: 1px solid rgba(32,31,29,.24);\">\n        <canvas class=\"bio-canvas bio-canvas-culture\" data-bio=\"culture\" data-alpha=\"0.62\" data-step=\"12\" data-seeds=\"14\" data-accent=\"234,9,9\" style=\"position: absolute; inset: 0; width: 100%; height: 100%;\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <figcaption style=\"position: absolute; left: 0; bottom: -34px; font-family: Lora, Georgia, serif; font-style: italic; font-size: 11.5px; letter-spacing: .06em; color: rgba(32,31,29,.45);\">Colony formation, six days<\u002Ffigcaption>\n    <\u002Ffigure>\n    <div style=\"max-width: 34ch;\">\n      <p data-reveal=\"0\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(32px, 4.8vw, 82px); line-height: 1.02; letter-spacing: -.032em; margin: 0; text-wrap: balance;\">\n        Frequently there is no company yet. Only a result.\n      <\u002Fp>\n      <p data-reveal=\"1\" style=\"font-size: clamp(14.5px, 1.1vw, 17px); line-height: 1.78; color: rgba(32,31,29,.68); margin: clamp(28px, 4vh, 48px) 0 0;\">\n        So we write the founding documents, recruit the first executives and set the development plan alongside the academic team. Company formation is the work, not the paperwork after it.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── companies ────────────────────────────────────────────────────────── -->\n<section id=\"companies\" style=\"border-top: 1px solid rgba(32,31,29,.16);\">\n  <div style=\"max-width: 1560px; margin: 0 auto; padding: clamp(96px, 17vh, 224px) clamp(22px, 4.5vw, 72px);\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 28px; flex-wrap: wrap; margin-bottom: clamp(40px, 6.5vh, 84px);\">\n      <h2 data-reveal=\"0\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(34px, 5vw, 84px); line-height: .98; letter-spacing: -.034em; margin: 0; max-width: 20ch;\">Twelve companies that did not exist.<\u002Fh2>\n      <span style=\"font-family: Lora, Georgia, serif; font-style: italic; font-size: 12px; letter-spacing: .06em; color: rgba(32,31,29,.5);\">2010 — 2026<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"border-top: 1px solid rgba(32,31,29,.16);\">\n      <sc-for list=\"{{ portfolio }}\" as=\"c\" hint-placeholder-count=\"12\">\n        <a href=\"#companies\" data-reveal=\"{{ c.i }}\" style=\"display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) 78px; gap: clamp(14px, 3vw, 48px); align-items: baseline; padding: clamp(18px, 2.8vh, 34px) 4px; border-bottom: 1px solid rgba(32,31,29,.16); transition: padding-left .45s cubic-bezier(.2,.7,.2,1), border-color .45s;\" style-hover=\"padding-left: 22px; border-color: rgba(234,9,9,.5);\">\n          <span style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(26px, 3vw, 46px); font-weight: 300; letter-spacing: -.024em; transition: color .4s;\" style-hover=\"color: #ea0909;\">{{ c.name }}<\u002Fspan>\n          <span style=\"font-family: Lora, Georgia, serif; font-style: italic; font-size: 12.5px; letter-spacing: .03em; color: rgba(32,31,29,.55);\">{{ c.tag }}<\u002Fspan>\n          <span style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 15px; color: rgba(32,31,29,.45); text-align: right; font-feature-settings: 'tnum';\">{{ c.year }}<\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font-family: Lora, Georgia, serif; font-style: italic; font-size: 11.5px; letter-spacing: .05em; color: rgba(32,31,29,.38); margin: 24px 0 0;\">Placeholder index — real names, sectors and vintages to be dropped in.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── key message III, on the capsid ───────────────────────────────────── -->\n<section style=\"position: relative; border-top: 1px solid rgba(32,31,29,.16); background: #201f1d; color: #f3f2f2; overflow: hidden;\">\n  <div style=\"max-width: 1560px; margin: 0 auto; padding: clamp(96px, 17vh, 224px) clamp(22px, 4.5vw, 72px); display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: clamp(34px, 6vw, 90px); align-items: center;\">\n    <figure data-reveal=\"0\" style=\"position: relative; margin: 0; aspect-ratio: 1; max-width: 520px; width: 100%;\">\n      <canvas class=\"bio-canvas bio-canvas-capsid\" data-bio=\"capsid\" data-ink=\"243,242,242\" data-alpha=\"0.62\" data-r=\"3.4\" data-points=\"520\" data-accent=\"252,176,67\" style=\"position: absolute; inset: 0; width: 100%; height: 100%;\"><\u002Fcanvas>\n    <\u002Ffigure>\n    <div data-reveal=\"1\">\n      <p style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(32px, 4.6vw, 78px); line-height: 1.02; letter-spacing: -.032em; margin: 0; max-width: 20ch; text-wrap: balance;\">\n        Therapeutics take a decade. We are still there in year nine.\n      <\u002Fp>\n      <p style=\"font-size: clamp(14.5px, 1.1vw, 17px); line-height: 1.78; color: rgba(243,242,242,.62); max-width: 44ch; margin: clamp(30px, 4.5vh, 52px) 0 0;\">\n        Capital is reserved and board seats are kept for the years that actually decide an outcome. Our returns come from valuation discipline at formation, not from later-round momentum.\n      <\u002Fp>\n      <div style=\"display: flex; gap: clamp(28px, 5vw, 64px); flex-wrap: wrap; margin-top: clamp(32px, 5vh, 56px);\">\n        <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div>\n            <div style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(38px, 3.6vw, 58px); line-height: 1; letter-spacing: -.03em; font-feature-settings: 'tnum';\">{{ s.n }}<\u002Fdiv>\n            <div style=\"font-family: Lora, Georgia, serif; font-style: italic; font-size: 12px; letter-spacing: .05em; color: rgba(243,242,242,.55); margin-top: 15px;\">{{ s.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── people & places ──────────────────────────────────────────────────── -->\n<section id=\"people\" style=\"max-width: 1560px; margin: 0 auto; padding: clamp(96px, 17vh, 224px) clamp(22px, 4.5vw, 72px);\">\n  <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(36px, 6vw, 96px); align-items: start;\">\n    <div data-reveal=\"0\">\n      <p style=\"font-family: Lora, Georgia, serif; font-style: italic; font-size: 13px; letter-spacing: .04em; color: rgba(32,31,29,.5); margin: 0 0 clamp(26px, 4vh, 40px);\">People &amp; places<\u002Fp>\n      <h2 style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(32px, 4.2vw, 66px); line-height: 1; letter-spacing: -.032em; margin: 0 0 clamp(22px, 3vh, 32px);\">Two offices, one investment committee.<\u002Fh2>\n      <p style=\"margin: 0 0 clamp(32px, 4.5vh, 52px); font-size: clamp(14.5px, 1.05vw, 16.5px); line-height: 1.8; color: rgba(32,31,29,.65); max-width: 42ch;\">Partners with doctorates and with profit and loss accounts — people who have run the experiment and then run the company. Edinburgh and Bethesda work as a single team across one time-shifted day.<\u002Fp>\n      <sc-for list=\"{{ places }}\" as=\"p\" hint-placeholder-count=\"2\">\n        <div style=\"border-top: 1px solid rgba(32,31,29,.16); padding: clamp(18px, 2.4vh, 26px) 0; display: flex; justify-content: space-between; gap: 20px; align-items: baseline;\">\n          <span style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 28px; font-weight: 300;\">{{ p.city }}<\u002Fspan>\n          <span style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 14px; color: rgba(32,31,29,.45); font-feature-settings: 'tnum';\">{{ p.coord }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: clamp(16px, 2.2vw, 28px);\">\n      <sc-for list=\"{{ team }}\" as=\"m\" hint-placeholder-count=\"4\">\n        <figure style=\"margin: 0;\">\n          <div style=\"aspect-ratio: 4 / 5; border: 6px solid #eae9e9; outline: 1px solid rgba(32,31,29,.14); background-color: #e4e2e0; background-image: repeating-linear-gradient(118deg, rgba(32,31,29,.05) 0 1px, transparent 1px 8px); display: flex; align-items: flex-end; padding: 12px;\">\n            <span style=\"font-family: Lora, Georgia, serif; font-style: italic; font-size: 11px; letter-spacing: .06em; color: rgba(32,31,29,.42);\">Portrait<\u002Fspan>\n          <\u002Fdiv>\n          <figcaption style=\"margin-top: 14px;\">\n            <div style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 21px; font-weight: 400;\">{{ m.name }}<\u002Fdiv>\n            <div style=\"font-family: Lora, Georgia, serif; font-style: italic; font-size: 11.5px; letter-spacing: .05em; color: rgba(32,31,29,.52); margin-top: 7px;\">{{ m.role }}<\u002Fdiv>\n          <\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── contact ──────────────────────────────────────────────────────────── -->\n<section id=\"contact\" style=\"position: relative; border-top: 1px solid rgba(32,31,29,.16); overflow: hidden;\">\n  <div style=\"max-width: 1560px; margin: 0 auto; padding: clamp(96px, 17vh, 224px) clamp(22px, 4.5vw, 72px) 0;\">\n    <h2 data-reveal=\"0\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(40px, 6.8vw, 118px); line-height: .95; letter-spacing: -.038em; margin: 0; max-width: 17ch;\">Send us the paper before the <span style=\"font-style: italic; color: #ea0909;\">pitch<\u002Fspan>.<\u002Fh2>\n  <\u002Fdiv>\n\n  <div style=\"position: relative; margin: clamp(46px, 8vh, 96px) 0 0;\">\n    <canvas class=\"bio-canvas bio-canvas-bands\" data-bio=\"bands\" data-alpha=\"0.85\" data-colw=\"54\" data-rowh=\"9\" data-accent=\"234,9,9\" style=\"display: block; width: 100%; height: clamp(130px, 17vw, 210px); -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 16%, #000 84%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0%, #000 16%, #000 84%, transparent 100%);\"><\u002Fcanvas>\n    <div style=\"max-width: 1560px; margin: 0 auto; padding: 0 clamp(22px, 4.5vw, 72px);\">\n      <p style=\"font-family: Lora, Georgia, serif; font-style: italic; font-size: 11.5px; letter-spacing: .06em; color: rgba(32,31,29,.45); margin: 18px 0 0;\">Sequence read-out, plate v<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 1560px; margin: clamp(30px, 5vh, 56px) auto 0; padding: clamp(40px, 6vh, 72px) clamp(22px, 4.5vw, 72px) clamp(96px, 17vh, 224px); display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: clamp(28px, 5vw, 80px); align-items: end; border-top: 1px solid rgba(32,31,29,.16);\">\n    <p data-reveal=\"1\" style=\"font-size: clamp(14.5px, 1.1vw, 17px); line-height: 1.78; color: rgba(32,31,29,.62); max-width: 46ch; margin: 0;\">Fund IV is investing. We are equally glad to hear from limited partners assessing a valuation-disciplined entry into world-class science.<\u002Fp>\n    <div data-reveal=\"2\" style=\"display: flex; gap: clamp(24px, 4vw, 48px); flex-wrap: wrap;\">\n      <a href=\"mailto:hello@epidarex.com\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 25px; color: #ea0909; border-bottom: 1px solid rgba(234,9,9,.4); padding-bottom: 7px; transition: border-color .4s;\" style-hover=\"border-color: #ea0909;\">hello@epidarex.com<\u002Fa>\n      <a href=\"mailto:ir@epidarex.com\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 25px; color: rgba(32,31,29,.6); border-bottom: 1px solid rgba(32,31,29,.24); padding-bottom: 7px; transition: color .4s, border-color .4s;\" style-hover=\"color: #201f1d; border-color: rgba(32,31,29,.55);\">Investor relations<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top: 1px solid rgba(32,31,29,.16); background: #eae9e9;\">\n  <div style=\"max-width: 1560px; margin: 0 auto; padding: clamp(56px, 8.5vh, 100px) clamp(22px, 4.5vw, 72px); display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: clamp(26px, 4vw, 60px); align-items: start;\">\n    <div>\n      <div style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px; letter-spacing: .2em;\">EPIDAREX<\u002Fdiv>\n      <p style=\"margin: 16px 0 0; font-size: 12.5px; line-height: 1.8; color: rgba(32,31,29,.55); max-width: 28ch;\">Life science venture capital. Edinburgh and Bethesda, Maryland.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 11px; font-size: 12.5px; letter-spacing: .05em; color: rgba(32,31,29,.58);\">\n      <a href=\"#thesis\">Thesis<\u002Fa><a href=\"#companies\">Companies<\u002Fa><a href=\"#people\">People<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 11px; font-size: 12.5px; letter-spacing: .05em; color: rgba(32,31,29,.58);\">\n      <a href=\"#contact\">Contact<\u002Fa><a href=\"#contact\">Investors<\u002Fa><a href=\"#top\">Back to top<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font-family: Lora, Georgia, serif; font-size: 11.5px; letter-spacing: .04em; color: rgba(32,31,29,.42); line-height: 2.05;\">\n      © 2026 Epidarex Capital<br>Authorised and regulated<br>Privacy · Terms\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;reveals&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.cleanup = []; }\n\n  componentDidMount() {\n    import(window.__resources.bioJs).then(({ mountBio, mountReveal }) => {\n      this.cleanup.push(mountBio(document.body));\n      if (this.props.reveals !== false) this.cleanup.push(mountReveal(document.body));\n    });\n  }\n\n  componentWillUnmount() { this.cleanup.forEach(f => f && f()); }\n\n  renderVals() {\n    const idx = (a) => a.map((o, i) => ({ ...o, i }));\n    return {\n      thesis: idx([\n        { num: 'i', title: 'We read the science ourselves', body: 'Partners with doctorates in the fields they fund. We assess the primary data, the protocol and the researcher before anything else.' },\n        { num: 'ii', title: 'We build the company, not just the round', body: 'Co-founding, first executive hires, the development plan. Often we are in the room before there is anything to invest in.' },\n        { num: 'iii', title: 'We go where capital does not', body: 'Scotland, the north of England, the Mid-Atlantic. Excellent science with few local first-cheque investors, entered at a disciplined price.' }\n      ]),\n      stats: idx([\n        { n: '$145m', label: 'Fund IV commitments' },\n        { n: '40+', label: 'Companies backed at formation' },\n        { n: '2010', label: 'First fund closed' }\n      ]),\n      portfolio: idx([\n        { name: 'Company', tag: 'Oncology', year: '2024' },\n        { name: 'Company', tag: 'Neurodegeneration', year: '2023' },\n        { name: 'Company', tag: 'Immunology', year: '2023' },\n        { name: 'Company', tag: 'Diagnostics', year: '2022' },\n        { name: 'Company', tag: 'Metabolic disease', year: '2022' },\n        { name: 'Company', tag: 'Medical device', year: '2021' },\n        { name: 'Company', tag: 'Rare disease', year: '2020' },\n        { name: 'Company', tag: 'Discovery platform', year: '2019' },\n        { name: 'Company', tag: 'Respiratory', year: '2018' },\n        { name: 'Company', tag: 'Fibrosis', year: '2016' },\n        { name: 'Company', tag: 'Vaccines', year: '2014' },\n        { name: 'Company', tag: 'Research tools', year: '2012' }\n      ]),\n      places: idx([\n        { city: 'Edinburgh', coord: '55.9533° N  3.1883° W' },\n        { city: 'Bethesda, MD', coord: '38.9847° N  77.0947° W' }\n      ]),\n      team: idx([\n        { name: 'Partner', role: 'Managing partner' },\n        { name: 'Partner', role: 'Partner, US' },\n        { name: 'Partner', role: 'Partner, UK' },\n        { name: 'Partner', role: 'Principal' }\n      ])\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
